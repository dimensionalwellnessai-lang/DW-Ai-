apply plugin: 'com.android.application'

android {
    namespace "com.reilbrown.fliptheswitch"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.reilbrown.fliptheswitch"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Use optimize version (recommended). The non-optimize one is what you're being warned about.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    lint {
        abortOnError false
        warningsAsErrors false
    }

    // Don’t fail release build due to lint warnings
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])

    implementation project(":capacitor-android")
    implementation project(":capacitor-cordova-android-plugins")

    // Required for @style/AppTheme + Theme.MaterialComponents / Material3
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"

    // Good baseline (safe)
    implementation "androidx.core:core-ktx:1.12.0"
    testImplementation 'junit:junit:4.13.2'
}